<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodinný průzkum dárků</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
    <button type="button" class="homeLink" data-i18n="home" onclick="location.reload()"></button>

    <div class="langSwitch">
        <button type="button" class="langBtn" data-lang="cs" onclick="setLang('cs')">CS</button>
        <button type="button" class="langBtn" data-lang="sk" onclick="setLang('sk')">SK</button>
        <button type="button" class="langBtn" data-lang="fr" onclick="setLang('fr')">FR</button>
    </div>

    <div id="saveStatus" class="saveStatus"></div>
</div>

<div class="container">

    <div id="loginScreen" class="card">
        <h1 data-i18n="app_title"></h1>

        <label for="nameInput" data-i18n="name_label"></label>

        <input
            type="text"
            id="nameInput"
            list="respondentList"
            data-i18n-placeholder="name_placeholder"
            autocomplete="off">

        <datalist id="respondentList"></datalist>

        <button class="submit" id="startButton" data-i18n="start_button" onclick="startSurvey()"></button>

        <p id="loginMessage" class="message"></p>

        <div class="divider"></div>

        <button type="button" class="secondary" id="overviewButton" data-i18n="overview_button" onclick="showOverview()"></button>

        <button type="button" class="secondary" id="highlightsButton" data-i18n="highlights_button" onclick="showHighlights()"></button>

        <button type="button" class="secondary" id="addGiftScreenButton" data-i18n="addgift_button" onclick="showAddGiftScreen()"></button>
    </div>

    <div id="surveyScreen" class="card" style="display:none;">
        <div class="progress" id="progress"></div>

        <h2 id="giftName"></h2>

        <div class="sliderWrap">
            <input
                type="range"
                id="scoreSlider"
                min="-10"
                max="10"
                step="1"
                value="0"
                oninput="updateSliderValue(this, 'sliderValue')">

            <div class="sliderLabels">
                <span data-i18n="slider_bad"></span>
                <span data-i18n="slider_neutral"></span>
                <span data-i18n="slider_good"></span>
            </div>

            <div class="sliderValue" id="sliderValue">0</div>
        </div>

        <p class="hint" id="voteHint" data-i18n="vote_hint"></p>

        <div class="voteConfirm" id="voteConfirm" style="display:none;"></div>

        <textarea
            id="commentInput"
            data-i18n-placeholder="comment_placeholder"
            rows="2"></textarea>

        <div class="buttonRow">
            <button type="button" class="secondary" id="backButton" data-i18n="back_button" onclick="goBack()" style="display:none;"></button>

            <button type="button" class="secondary" id="cancelEditButton" data-i18n="cancel_edit_button" onclick="cancelEdit()" style="display:none;"></button>
        </div>
    </div>

    <div id="overviewScreen" class="card" style="display:none;">
        <h2 data-i18n="overview_title"></h2>

        <label for="personSelect" data-i18n="person_select_label"></label>
        <select id="personSelect" onchange="onPersonSelected()">
            <option value="" data-i18n="person_select_default"></option>
        </select>

        <div class="divider"></div>

        <p class="hint" data-i18n="overview_hint"></p>

        <div id="overviewList"></div>
    </div>

    <div id="reviewScreen" class="card" style="display:none;">
        <button type="button" class="linkBack" data-i18n="review_back_link" onclick="showOverview()"></button>

        <h2 id="reviewTitle"></h2>

        <div id="reviewList"></div>
    </div>

    <div id="highlightsScreen" class="card" style="display:none;">
        <h2 data-i18n="highlights_title"></h2>

        <h3 data-i18n="top_favorite_heading"></h3>
        <div id="topFavoriteList"></div>

        <h3 data-i18n="top_unpopular_heading"></h3>
        <div id="topUnpopularList"></div>

        <h3 data-i18n="top_controversial_heading"></h3>
        <p class="hint" data-i18n="controversial_hint"></p>
        <div id="topControversialList"></div>
    </div>

    <div id="addGiftScreen" class="card" style="display:none;">
        <h2 data-i18n="addgift_title"></h2>
        <p class="hint" data-i18n="addgift_hint"></p>

        <input type="text" id="newGiftInput" data-i18n-placeholder="gift_name_placeholder" autocomplete="off">

        <button class="submit" id="addGiftButton" data-i18n="addgift_submit" onclick="submitNewGift()"></button>

        <p id="addGiftMessage" class="message"></p>
    </div>

    <div id="finishScreen" class="card" style="display:none;">
        <h2 id="finishTitle"></h2>

        <button type="button" class="secondary" id="finishBackButton" data-i18n="finish_back_button" onclick="goBack()" style="display:none;"></button>

        <p data-i18n="finish_prompt"></p>

        <input id="extraGift" data-i18n-placeholder="gift_name_placeholder" autocomplete="off">

        <div class="sliderWrap">
            <input
                type="range"
                id="extraScoreSlider"
                min="-10"
                max="10"
                step="1"
                value="0"
                oninput="updateSliderValue(this, 'extraSliderValue')">

            <div class="sliderLabels">
                <span data-i18n="slider_bad"></span>
                <span data-i18n="slider_neutral"></span>
                <span data-i18n="slider_good"></span>
            </div>

            <div class="sliderValue" id="extraSliderValue">0</div>
        </div>

        <textarea
            id="extraComment"
            data-i18n-placeholder="comment_placeholder"
            rows="2"></textarea>

        <button class="submit" id="addExtraButton" data-i18n="extra_add_button" onclick="saveExtraGift()"></button>

        <p id="extraMessage" class="message"></p>
    </div>

</div>

<script src="app.js"></script>
</body>
</html>
