<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodinný průzkum dárků</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div id="saveStatus" class="saveStatus"></div>

    <div id="loginScreen">
        <h1>Rodinný průzkum dárků</h1>

        <label for="nameInput">Jak se jmenuješ?</label>

        <input
            type="text"
            id="nameInput"
            list="respondentList"
            placeholder="Začni psát jméno"
            autocomplete="off">

        <datalist id="respondentList"></datalist>

        <button id="startButton" onclick="startSurvey()">
            Začít
        </button>

        <button type="button" class="secondary" id="reviewButton" onclick="openReview()">
            📋 Zobrazit / upravit moje odpovědi
        </button>

        <p id="loginMessage" class="message"></p>
    </div>

    <div id="surveyScreen" style="display:none;">
        <div class="progress" id="progress"></div>

        <h2 id="giftName"></h2>

        <div class="sliderWrap">
            <input
                type="range"
                id="scoreSlider"
                min="-10"
                max="10"
                step="1"
                value="0"
                oninput="updateSliderValue(this, 'sliderValue')">

            <div class="sliderLabels">
                <span>-10 Nevhodné</span>
                <span>0 Nemám názor</span>
                <span>+10 Ideální</span>
            </div>

            <div class="sliderValue" id="sliderValue">0</div>
        </div>

        <p class="hint" id="voteHint">Posun posuvníku odešle hodnocení a posune tě na další dárek.</p>

        <div class="voteConfirm" id="voteConfirm" style="display:none;"></div>

        <textarea
            id="commentInput"
            placeholder="Komentář (nepovinné) — Enter odešle, Shift+Enter nový řádek"
            rows="2"></textarea>

        <div class="buttonRow">
            <button type="button" class="secondary" id="backButton" onclick="goBack()" style="display:none;">
                ⬅ Zpět
            </button>

            <button type="button" class="secondary" id="cancelEditButton" onclick="cancelEdit()" style="display:none;">
                Zrušit úpravu
            </button>
        </div>
    </div>

    <div id="reviewScreen" style="display:none;">
        <h2>Tvoje odpovědi</h2>

        <div id="reviewList"></div>

        <button type="button" class="secondary" onclick="location.reload()">
            ↩ Zpět na úvod
        </button>
    </div>

    <div id="finishScreen" style="display:none;">
        <h2 id="finishTitle">Hotovo 🎉</h2>

        <button type="button" class="secondary" id="finishBackButton" onclick="goBack()" style="display:none;">
            ⬅ Opravit poslední hodnocení
        </button>

        <p>Napadá tě ještě další dárek, který jsme v seznamu neměli?</p>

        <input id="extraGift" placeholder="Název dárku" autocomplete="off">

        <div class="sliderWrap">
            <input
                type="range"
                id="extraScoreSlider"
                min="-10"
                max="10"
                step="1"
                value="0"
                oninput="updateSliderValue(this, 'extraSliderValue')">

            <div class="sliderLabels">
                <span>-10 Nevhodné</span>
                <span>0 Nemám názor</span>
                <span>+10 Ideální</span>
            </div>

            <div class="sliderValue" id="extraSliderValue">0</div>
        </div>

        <textarea
            id="extraComment"
            placeholder="Komentář (nepovinné) — Enter odešle, Shift+Enter nový řádek"
            rows="2"></textarea>

        <button class="submit" id="addExtraButton" onclick="saveExtraGift()">
            Přidat
        </button>

        <p id="extraMessage" class="message"></p>
    </div>

</div>

<script src="app.js"></script>
</body>
</html>
