<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodinný průzkum dárků</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div id="loginScreen">
        <h1>Rodinný průzkum dárků</h1>

        <label for="nameInput">Jak se jmenuješ?</label>

        <input
            type="text"
            id="nameInput"
            list="respondentList"
            placeholder="Začni psát jméno"
            autocomplete="off">

        <datalist id="respondentList"></datalist>

        <button id="startButton" onclick="startSurvey()">
            Začít
        </button>

        <p id="loginMessage" class="message"></p>
    </div>

    <div id="surveyScreen" style="display:none;">
        <div class="progress" id="progress"></div>

        <h2 id="giftName"></h2>

        <button class="favorite" onclick="vote('Oblíbené')">
            ❤️ Oblíbený dárek
        </button>

        <button class="bad" onclick="vote('Nevhodné')">
            ❌ Nevhodný dárek
        </button>

        <button class="neutral" onclick="vote('Nemám názor')">
            ➖ Nemám názor
        </button>
    </div>

    <div id="finishScreen" style="display:none;">
        <h2 id="finishTitle">Hotovo 🎉</h2>

        <p>Napadá tě ještě další dárek, který jsme v seznamu neměli?</p>

        <input id="extraGift" placeholder="Název dárku" autocomplete="off">

        <select id="extraType">
            <option value="Oblíbené">Oblíbený dárek</option>
            <option value="Nevhodné">Nevhodný dárek</option>
        </select>

        <button id="addExtraButton" onclick="saveExtraGift()">
            Přidat
        </button>

        <p id="extraMessage" class="message"></p>
    </div>

</div>

<script src="app.js"></script>
</body>
</html>
